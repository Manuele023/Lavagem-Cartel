<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartel - Admin</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    margin:0;
    min-height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,.85),
        rgba(0,0,0,.95)
    ),
    url("fundo-cartel.png");

    background-size:cover;
    background-position:center;

    color:white;

    padding:30px;

}



.container{

    max-width:1000px;

    margin:auto;

    background:rgba(20,20,20,.92);

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 35px black;

}



.logo{

    text-align:center;

}


.logo img{

    width:90px;

}



h1{

    text-align:center;

    color:#b30000;

    letter-spacing:3px;

}



.topo{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:50px;

    margin-bottom:20px;

}



button{

    padding:10px 15px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

}



.voltar{

    background:#333;

    color:white;

}



.usuario{

    background:#111;

    border:1px solid #333;

    padding:20px;

    border-radius:12px;

    margin-bottom:15px;

}



.usuario span{

    display:block;

    margin:5px 0;

}



.aprovar{

    background:#006400;

    color:white;

}



.bloquear{

    background:#8b0000;

    color:white;

}



.ativar{

    background:#006400;

    color:white;

}

.usuario-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.usuario-nome{
    font-size:20px;
    font-weight:bold;
    color:#fff;
}

.usuario-login{
    color:#999;
    margin-top:3px;
}

.usuario-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:15px 0;
}

.info-box{
    background:#181818;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
}

.acoes{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.cargos{
    color:#ffd54f;
    font-weight:bold;
}

.editar{
    background:#0057b8;
    color:white;
}

.resetar{
    background:#7a4d00;
    color:white;
}

#pesquisaUsuario{

    width:100%;

    padding:12px;

    margin-bottom:20px;

    background:#111;

    border:1px solid #333;

    border-radius:8px;

    color:white;

    outline:none;

}


#pesquisaUsuario:focus{

    border-color:#b30000;

}

.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.8);

    align-items:center;

    justify-content:center;

    z-index:999;

}



.modal-box{

    background:#151515;

    padding:30px;

    border-radius:15px;

    width:350px;

    box-shadow:0 0 30px black;

}



.modal-box label{

    display:block;

    margin:15px 0;

    font-size:16px;

}


.modal-box input{

    margin-right:10px;

}


#bloqueioInicial{

    position:fixed;

    inset:0;

    background:#000;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:20px;

    z-index:9999;

}    

    
#listaUsuarios{

    max-height:625px;

    overflow-y:auto;

    padding:15px;

    background:rgba(0,0,0,.25);

    border:1px solid #333;

    border-radius:12px;

}

#listaAuditoria{

    max-height:303px;

    overflow-y:auto;

    padding:15px;

    background:rgba(0,0,0,.25);

    border:1px solid #333;

    border-radius:12px;

}



.log{

    background:#111;

    border:1px solid #333;

    padding:15px;

    border-radius:10px;

    margin-bottom:10px;

}



.log span{

    display:block;

    margin:5px 0;

}

.subtitulo{

    color:white;

    font-size:24px;

    font-weight:bold;

    letter-spacing:2px;

    margin-top:30px;

    margin-bottom:10px;

}


.filtrosAuditoria{

    display:flex;

    gap:12px;

    margin:15px 0 20px;

    flex-wrap:wrap;

}


.filtrosAuditoria input,
.filtrosAuditoria select{

    flex:1;

    min-width:220px;

    padding:12px;

    background:#111;

    color:white;

    border:1px solid #333;

    border-radius:8px;

    outline:none;

    font-size:14px;

}


.filtrosAuditoria input:focus,
.filtrosAuditoria select:focus{

    border-color:#b30000;

}


/* ---------------- SCROLL TRANSPARENTE ---------------- */

#listaUsuarios::-webkit-scrollbar,
#listaAuditoria::-webkit-scrollbar{

    width:6px;

}


#listaUsuarios::-webkit-scrollbar-track,
#listaAuditoria::-webkit-scrollbar-track{

    background:transparent;

}


#listaUsuarios::-webkit-scrollbar-thumb,
#listaAuditoria::-webkit-scrollbar-thumb{

    background:rgba(255,255,255,0.12);

    border-radius:10px;

}


#listaUsuarios::-webkit-scrollbar-thumb:hover,
#listaAuditoria::-webkit-scrollbar-thumb:hover{

    background:rgba(255,255,255,0.25);

}


/* Firefox */

#listaUsuarios,
#listaAuditoria{

    scrollbar-width:thin;

    scrollbar-color:rgba(255,255,255,0.12) transparent;

}

#listaAuditoria::-webkit-scrollbar-track{

    background:transparent;

}


#listaAuditoria::-webkit-scrollbar-thumb{

    background:rgba(179,0,0,.5);

    border-radius:10px;

}


#listaAuditoria::-webkit-scrollbar-thumb:hover{

    background:rgba(179,0,0,.9);

}


</style>

</head>



<body>

<div id="bloqueioInicial">
    Verificando acesso...
</div>

<div class="container">


<div class="logo">

<img src="logo.png">

</div>


<h1>
PAINEL ADMINISTRATIVO
</h1>


<div class="topo">

<h2 class="subtitulo">
👤 Usuários
</h2>

    
<button 
class="voltar"
onclick="voltar()">

⬅ Voltar

</button>

</div>

<input 
id="pesquisaUsuario"
placeholder="🔎 Buscar usuário..."
>
    
<div id="listaUsuarios">

Carregando...

</div>

<h2 class="subtitulo">
📋 Auditoria
</h2>

<div class="filtrosAuditoria">

    <input
    id="buscarAuditoria"
    placeholder="🔎 Buscar..."
    >

    <select id="filtroGravidade">
        <option value="">🚦 Todas as gravidades</option>
        <option value="informacao">🟢 Informação</option>
        <option value="atencao">🟡 Atenção</option>
        <option value="critico">🔴 Crítico</option>
    </select>

    <select id="filtroTipo">
        <option value="">📌 Todos os tipos</option>
        <option value="usuario">👤 Usuário</option>
        <option value="seguranca">🔐 Segurança</option>
        <option value="administracao">⚙️ Administração</option>
    </select>

<select id="filtroPeriodo">

    <option value="">
        📅 Todo período
    </option>

    <option value="hoje">
        📅 Hoje
    </option>

    <option value="7dias">
        📅 Últimos 7 dias
    </option>

    <option value="30dias">
        📅 Últimos 30 dias
    </option>

</select>

</div>
    
<div id="listaAuditoria">

Carregando logs...

</div>

<div id="modalCargos" class="modal">

    <div class="modal-box">

        <h2>
            Editar cargos
        </h2>


        <label>
            <input type="checkbox" id="cargoDono">
            👑 Dono
        </label>


        <label>
            <input type="checkbox" id="cargoAdmin">
            🛡️ Admin
        </label>


        <label>
            <input type="checkbox" id="cargoProducao">
            ⚙️ Produção
        </label>


        <label>
            <input type="checkbox" id="cargoMembro">
            👤 Membro
        </label>


        <br>


        <button 
        class="aprovar"
        onclick="salvarCargos()">

            Salvar

        </button>


        <button 
        class="bloquear"
        onclick="fecharModal()">

            Cancelar

        </button>


    </div>

</div>

</div>



<script type="module">


import { auth, db } from "./firebase.js";


import {

onAuthStateChanged,
sendPasswordResetEmail

}

from

"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


import {

collection,
    
getDocs,
    
doc,
    
getDoc,
    
updateDoc,
    
addDoc,
    
serverTimestamp,

query,

orderBy

}

from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


let dadosAdmin = null;


const lista =
document.getElementById("listaUsuarios");


const pesquisa =
document.getElementById("pesquisaUsuario");


const listaAuditoria =
document.getElementById("listaAuditoria");


let usuariosCache = [];

let usuarioEditando = null;

let logsCache = [];


function temCargo(cargo){

    return dadosAdmin.cargos &&
    dadosAdmin.cargos.includes(cargo);

}


function ehDono(){

    return temCargo("Dono");

}


function ehAdmin(){

    return temCargo("Admin") || ehDono();

}


async function registrarAuditoria(
    tipo,
    evento,
    gravidade,
    usuario,
    usuarioId,
    descricao
){

    await addDoc(
        collection(db,"auditoria"),
        {

            tipo: tipo,

            evento: evento,

            gravidade: gravidade,

            usuario: usuario || "-",

            usuarioId: usuarioId || "-",

            administrador: dadosAdmin.nomeUsuario || "-",

            administradorId: auth.currentUser.uid,

            descricao: descricao,

            data: serverTimestamp()

        }
    );

}
    

onAuthStateChanged(auth, async(user)=>{


if(!user){

    window.location.replace("login.html");

    return;

}



const adminRef =
doc(db,"usuarios",user.uid);


const adminSnap = await getDoc(adminRef);


if(!adminSnap.exists()){

    alert("Usuário não encontrado.");

    window.location.replace("index.html");

    return;

}


dadosAdmin = adminSnap.data();


if(!ehAdmin()){

    alert("Acesso negado.");

    window.location.replace("index.html");

    return;

}


document.getElementById("bloqueioInicial")?.remove();


carregarUsuarios();
carregarAuditoria();


});




async function carregarUsuarios(){

console.log("Iniciou carregamento");


lista.innerHTML="";


const usuarios =
await getDocs(collection(db,"usuarios"));
    
usuariosCache = [];


console.log("Total usuários:", usuarios.size);



usuarios.forEach((usuario)=>{


const u = usuario.data();


usuariosCache.push({
    id: usuario.id,
    dados: u
});


const dataCadastro = u.criadoEm 
    ? u.criadoEm.toDate().toLocaleDateString("pt-BR")
    : "-";


console.log("Usuário:", u);

lista.innerHTML += `

<div class="usuario">


<span>
<b>Nome de usuário:</b> ${u.nomeUsuario || "-"}
</span>


<span>
<b>Nome em RP:</b> ${u.nomeRP || "-"}
</span>


<span>
<b>Email:</b> ${u.email || "-"}
</span>

<span>
<b>Cadastro:</b>
${dataCadastro}
</span>


<span>
<b>Aprovado:</b>
${u.aprovado ? "✅ Sim" : "⏳ Pendente"}
</span>


<span>
<b>Status:</b> 
${u.ativo ? "🟢 Ativo" : "🔴 Bloqueado"}
</span>


<span>
<b>Cargos:</b>
${u.cargos 
? u.cargos.map(mostrarCargo).join(" • ") 
: "👤 Membro"}
</span>


<br>


${
!u.aprovado ?

`

<button 
class="aprovar"
onclick="aprovar('${usuario.id}')">

✅ Aprovar

</button>

`

:

""

}



<button

class="${u.ativo ? "bloquear" : "ativar"}"

onclick="alterarStatus('${usuario.id}', ${u.ativo})">

${u.ativo ? "🔒 Bloquear" : "🟢 Ativar"}

</button>



<button

class="editar"

onclick="editarCargos('${usuario.id}')">

🎖️ Editar cargos

</button>



<button

class="resetar"

onclick="resetarSenha('${usuario.id}')">

🔑 Redefinir senha

</button>



</div>

`;



});


}


async function carregarAuditoria(){

    const logs = await getDocs(

    query(

        collection(db,"auditoria"),

        orderBy("data", "desc")

    )

);

    logsCache = [];

    if(logs.empty){

        listaAuditoria.innerHTML = "Nenhum registro encontrado.";

        return;

    }

    logs.forEach((log)=>{

        logsCache.push(log.data());

    });

    mostrarLogs(logsCache);

}


window.aprovar = async function(id){

    if(!confirm("Aprovar este usuário?")){
        return;
    }

    await updateDoc(
        doc(db,"usuarios",id),
        {
            aprovado:true
        }
    );

    carregarUsuarios();

}


window.alterarStatus = async function(id,status){

    const acao = status ? "bloquear" : "ativar";

    if(!confirm(`Deseja ${acao} este usuário?`)){
        return;
    }


    const usuarioRef = doc(db,"usuarios",id);

    const usuarioSnap = await getDoc(usuarioRef);


    if(!usuarioSnap.exists()){
        alert("Usuário não encontrado.");
        return;
    }


    const usuario = usuarioSnap.data();


    await updateDoc(
        usuarioRef,
        {
            ativo:!status
        }
    );


    await registrarAuditoria(

        "usuario",

        status ? "Conta bloqueada" : "Conta desbloqueada",

        status ? "atencao" : "informacao",

        usuario.nomeUsuario,

        id,

        status
        ? `Conta de ${usuario.nomeUsuario} foi bloqueada.`
        : `Conta de ${usuario.nomeUsuario} foi desbloqueada.`

    );


    carregarUsuarios();

}

    
window.voltar=function(){

window.location.href="index.html";

    
}

    
window.editarCargos = async function(id){

    usuarioEditando = id;


    const usuarioRef = doc(db,"usuarios",id);

    const usuarioSnap = await getDoc(usuarioRef);


    if(!usuarioSnap.exists()){

        alert("Usuário não encontrado.");

        return;

    }


    const u = usuarioSnap.data();


    const cargos = u.cargos || ["Membro"];


    document.getElementById("cargoDono").checked =
        cargos.includes("Dono");

    const checkboxDono =
document.getElementById("cargoDono");


if(!ehDono()){

    checkboxDono.disabled = true;

}
else{

    checkboxDono.disabled = false;

}

    document.getElementById("cargoAdmin").checked =
        cargos.includes("Admin");


    document.getElementById("cargoProducao").checked =
        cargos.includes("Produção");


    document.getElementById("cargoMembro").checked =
        cargos.includes("Membro");



    document.getElementById("modalCargos").style.display = "flex";


}


window.fecharModal = function(){

    document.getElementById("modalCargos").style.display = "none";

    usuarioEditando = null;

}


window.salvarCargos = async function(){


    const cargos = [];

    if(!ehDono() && document.getElementById("cargoDono").checked){

    alert("Apenas o Dono pode atribuir esse cargo.");

    return;

    }
    
    
    if(document.getElementById("cargoDono").checked){
        cargos.push("Dono");
    }


    if(document.getElementById("cargoAdmin").checked){
        cargos.push("Admin");
    }


    if(document.getElementById("cargoProducao").checked){
        cargos.push("Produção");
    }


    if(document.getElementById("cargoMembro").checked){
        cargos.push("Membro");
    }



    if(cargos.length === 0){

        alert("O usuário precisa ter pelo menos um cargo.");

        return;
    }



    await updateDoc(

        doc(db,"usuarios",usuarioEditando),

        {
            cargos:cargos
        }

    );


    alert("Cargos atualizados com sucesso!");


    document.getElementById("modalCargos").style.display="none";


    carregarUsuarios();


}

window.resetarSenha = async function(id){


    const usuarioRef = doc(db,"usuarios",id);


    const usuarioSnap = await getDoc(usuarioRef);


    if(!usuarioSnap.exists()){

        alert("Usuário não encontrado.");

        return;

    }


    const usuario = usuarioSnap.data();


    const confirmar = confirm(
        `Enviar e-mail de redefinição de senha para:\n\n${usuario.email}?`
    );


    if(!confirmar){

        return;

    }


    try{


        await sendPasswordResetEmail(
            auth,
            usuario.email
        );


        alert(
            "✅ E-mail de redefinição enviado com sucesso."
        );


    }catch(e){


        console.error(e);


        alert(
            "❌ Não foi possível enviar o e-mail."
        );


    }


}

    
function mostrarCargo(cargo){

    const emojis = {

        "Dono":"👑 Dono",

        "Admin":"🛡️ Admin",

        "Produção":"⚙️ Produção",

        "Membro":"👤 Membro"

    };


    return emojis[cargo] || cargo;

}


function mostrarGravidade(gravidade){

    const lista = {

        "informacao":"🟢 Informação",

        "atencao":"🟡 Atenção",

        "critico":"🔴 Crítico"

    };


    return lista[gravidade] || gravidade;

}


function mostrarTipo(tipo){

    const lista = {

        "usuario":"Usuário",

        "seguranca":"Segurança",

        "administracao":"Administração"

    };


    return lista[tipo] || tipo;

}


pesquisa.addEventListener("input", function(){

    const termo = pesquisa.value.toLowerCase();

    const cards = document.querySelectorAll(".usuario");

    let primeiroEncontrado = null;


    cards.forEach((card)=>{

        const texto = card.innerText.toLowerCase();


        if(texto.includes(termo)){

            card.style.display = "";


            if(!primeiroEncontrado){

                primeiroEncontrado = card;

            }


        }else{

            card.style.display = "none";

        }


    });



    if(primeiroEncontrado && termo !== ""){

        primeiroEncontrado.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    }


});


function mostrarLogs(lista){

    listaAuditoria.innerHTML = "";

lista.forEach((l)=>{

    const dataHora = l.data
        ? l.data.toDate().toLocaleString("pt-BR")
        : "-";


    listaAuditoria.innerHTML += `

<div class="log">

<span>
${mostrarGravidade(l.gravidade)}
</span>

<br>

<span>
<b>📅 Data:</b> ${dataHora}
</span>

<br>

<span>
<b>⚡ Evento:</b> ${l.evento}
</span>

<span>
<b>🛡️ Administrador:</b> ${l.administrador}
</span>

<span>
<b>👤 Usuário:</b> ${l.usuario}
</span>

<span>
<b>📝 Descrição:</b> ${l.descricao}
</span>

<span>
<b>📌 Tipo:</b> ${mostrarTipo(l.tipo)}
</span>

</div>

        `;

    });

}


document.getElementById("buscarAuditoria")
.addEventListener("input", filtrarAuditoria);

document.getElementById("filtroGravidade")
.addEventListener("change", filtrarAuditoria);

document.getElementById("filtroTipo")
.addEventListener("change", filtrarAuditoria);

document.getElementById("filtroPeriodo")
.addEventListener("change", filtrarAuditoria);


function filtrarAuditoria(){

    const busca = document
        .getElementById("buscarAuditoria")
        .value
        .toLowerCase();

    const gravidade = document
        .getElementById("filtroGravidade")
        .value;

    const tipo = document
        .getElementById("filtroTipo")
        .value;

    const periodo = document
    .getElementById("filtroPeriodo")
    .value;
    
const filtrados = logsCache.filter((l)=>{


    const textoBusca = (

    (l.usuario || "") +
    " " +
    (l.descricao || "") +
    " " +
    (l.evento || "") +
    " " +
    (l.administrador || "") +
    " " +
    (l.tipo || "")

)
.toLowerCase()
.trim();



const passouBusca =

    busca === "" ||

    textoBusca.includes(busca);



    const passouGravidade =

        gravidade === "" ||

        l.gravidade === gravidade;



    const passouTipo =

        tipo === "" ||

        l.tipo === tipo;



    const passouPeriodo = (()=>{


        if(periodo === ""){

            return true;

        }


        if(!l.data){

            return false;

        }


        const dataLog = l.data.toDate();

        const agora = new Date();



        if(periodo === "hoje"){


            return (

                dataLog.getDate() === agora.getDate() &&

                dataLog.getMonth() === agora.getMonth() &&

                dataLog.getFullYear() === agora.getFullYear()

            );


        }



        if(periodo === "7dias"){


            const limite = new Date();


            limite.setDate(
                agora.getDate() - 7
            );


            return dataLog >= limite;


        }



        if(periodo === "30dias"){


            const limite = new Date();


            limite.setDate(
                agora.getDate() - 30
            );


            return dataLog >= limite;


        }


        return true;


    })();



    return (

        passouBusca &&

        passouGravidade &&

        passouTipo &&

        passouPeriodo

    );


});


mostrarLogs(filtrados);

}


</script>


</body>

</html>
